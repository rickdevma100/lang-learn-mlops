name: Build, Scan, Sign, Push (MLOps & Gateway)

on:
  push:
    branches: [main]
    paths:
      - 'inference/**'
      - '.github/workflows/ci.yml'

env:
  REGISTRY: ghcr.io
  PROJECT: rickdevma100
  SERVICE_NAME: inference
  CONTEXT: inference

jobs:
  build:
    name: Build, Scan & Sign Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless OIDC Cosign signing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and Push OCI Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile.kserve
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.SERVICE_NAME }}:latest
          provenance: true
          sbom: true

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.SERVICE_NAME }}:${{ steps.meta.outputs.tag }}
          format: 'sarif'
          output: 'trivy-${{ env.SERVICE_NAME }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (Keyless via OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.SERVICE_NAME }}@${{ steps.build.outputs.digest }}

  update-gitops:
    name: Update Image Tag in GitOps Repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: rickdevma100/lang-learn-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update Image Tag in Values
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          yq -i ".inference.image.tag = \"$TAG\"" environments/production/values.yaml

      - name: Commit and Push to GitOps Repo
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@yourdomain.com"
          git pull --rebase
          git add environments/production/values.yaml
          git commit -m "deploy(inference): bump image tag to sha-${GITHUB_SHA::12}"
          git push
